<!DOCTYPE html>

<html>

<head>
    <title>Table Practice</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="tablepractice.css">
</head>

<body>
    <div class="practice-table-1">
        <table>
            <colgroup>   
                <col span="1" class="column1">
                <col span="1" class="column2">
                <col span="1" class="column3">
                
                
            </colgroup>
            <tr>
                <th>City</th>
                <th>Administrative Division</th>
                <th>Country</th>
            </tr>
            <tr>
                <td>Dover</td>
                <td>New Hampshire</td>
                <td>United States</td>
            </tr>
            <tr>
                <td>Tokyo</td>
                <td>Tokyo</td>
                <td>Japan</td>
            </tr>
        </table>
    </div>

    <div class="practice-table-2">
        <table>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Date of Birth</th>
            </tr>
            <tr>
                <td>Smith</td>
                <td>Halls</td>
                <td>Feburary 29, 2000</td>
            </tr>
            <tr>
                <td>Winter</td>
                <td>Halls</td>
                <td>July 16, 1998</td>
            </tr>
            <tr>
                <table>
                    <tr>
                        <th>Tableception</th>
                    </tr>
                    <tr>
                        <td>This is Tables in Tables</td>
                    </tr>
                </table>
            </tr>
        </table>
    </div>



</body>


</html>
