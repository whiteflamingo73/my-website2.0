                <h3>My Forms</h3>

                <!--The Forms-->

                <div class="formholder">
                    <h1>Basic Form Thingy</h1>
                    <form>
                        <fieldset>
                            <label for="fname">First Name:</label><br>
                            <input type="text" id="fname" name="fname"><br>

                            <label for="lName">Last Name:</label><br>
                            <input type="text" id="lname" name="lname"><br>

                            <label for="dob">Date of Birth:</label><br>
                            <input type="date" id="dob" name="dob"><br>

                            <label for="gender">Gender:</label><br>
                            <select id="gender" name="gender">
                                <option value="CisMan">Cisgender Man</option>
                                <option value="CisWoman">Cisgender Woman</option>
                                <option value="TransMan">Transgender Man</option>
                                <option value="TransWoman">Transgender Woman</option>
                                <option value="Nonbinary">Nonbinary</option>
                                <option value="Other">Other</option>
                                <option value="PNTS">Prefer Not To Say</option>
                            </select><br>



                            <label for="email">Email:</label><br>
                            <input type="email" id="email" name="email"><br>

                            <label for="password">Password:</label><br>
                            <input type="password" id="password" name="password"><br>
                            <br><br>

                            <p>What transportation do you take?</p>

                            <input type="checkbox" id="transit1" name="transit1" value="Bike">
                            <label for="transit1">I bike</label><br>

                            <input type="checkbox" id="transit2" name="transit2" value="Walk">
                            <label for="transit2">I walk</label><br>

                            <input type="checkbox" id="transit3" name="transit3" value="Car">
                            <label for="transit3">I drive</label><br>

                            <input type="checkbox" id="transit4" name="transit4" value="TrainandBus">
                            <label for="transit4">I take the train/bus</label>
                            <br><br>

                            <input type="submit" value="Submit" onclick="return formValidation(this.form);">
                            <br><br>
                        </fieldset>
                    </form>

    <!--JavaScript-->

    <!--For the First Form:-->

    <script LANGUAGE="JavaScript">
        function formValidation(form) {

            // var is a variable
            var fName = form.fname.value;
            var lName = form.lname.value;
            var email = form.email.value;
            var password = form.password.value;
            var Gender = form.gender.value;
            var dob = form.dob.value;

            //if else statements
            if (form.transit1.checked) {
                var Trans1 = "Bike";
            } else {
                var Trans1 = "";
            }

            if (form.transit2.checked) {
                var Trans2 = "Walk";
            } else {
                var Trans2 = "";
            }

            if (form.transit3.checked) {
                var Trans3 = "Drive";
            } else {
                var Trans3 = "";
            }

            if (form.transit4.checked) {
                var Trans4 = "Public Transit";
            } else {
                var Trans4 = "";
            }

            
            // Lines displayed when someone clicks the submit button:
            var FirstLine = ("Welcome " + fName + " " + lName + ", your email is " + email + ", you are a " + Gender + "." + ".\n\n");
            var SecondLine = ("You take a " + Trans1 + Trans2 + Trans3 + Trans4 + ". You were born on: " + dob + ", and your password is: " + password);

            // displays the actual message
            alert(FirstLine + SecondLine);

            window.location.href = "Forms.html";

            return false;
        }

    </script>

    <script>
        let alertBox =

        let alert_Message_container =

        let body =

        custom_button.addEventListener
            ('click', function () {
                alert_Message_container.innerHTML =
                    "you clicked the button";
                alertBox.style.display = "block";
            });

        close_img.addEventListener
            ('click', function () {
                alert_Message_container.innerHTML =
                    "you clicked the button";
                alertBox.style.display = "none";
            });
    </script>
