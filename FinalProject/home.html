<!DOCTYPE html>

<html>

<head>
    <title>Adventure!</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="adventure.css">
    <script src="overseer.js" defer></script>
</head>

<body>

    <div class="intro"> <!--should have an animation of it coming down into place-->
        <h1 class="Title">Are You Ready For an Adventure?</h1>
        <h3>Choose a path, go where you want. The top of a mountain?
            The bottom of the ocean? A quaint train ride? A roadtrip?
            Go where the wind takes you.</h3>
    </div>


    <div class="adventureChoice">
        <button type="button" class="transChoice" id="car">
            <div class="car">
                <h2>Drive</h2>
                <img src="assets/car-temp.jpg">
                <p class="blurb">Highway, Country Roads--Solitude and Privacy</p>
            </div>
        </button>

        <button type="button" class="transChoice" id="train">
            <div class="Train">
                <h2>Train</h2>
                <img src="assets/train-temp.jpg">
                <p class="blurb">Rails, Tracks--Limited, but Relaxing</p>
            </div>
        </button>

        <button type="button" class="transChoice" id="bike">
            <div class="Bike">
                <h2>Bike</h2>
                <img src="assets/bike-temp.jpg">
                <p class="blurb">Paths, Short--Slow and Intensive</p>
            </div>
        </button>
    </div>



</body>










</html>
