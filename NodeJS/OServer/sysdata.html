<!DOCTYPE html>

<html>

<head>
    <title>system data</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <!--<link rel="stylesheet" href="basicIndex.css">-->
</head>

<body>
    <div class="PlatformContainer">
        <p>OS Platform: linux</p>
    </div>

    <div class="MemoryContainer">
        <p class="Memtot">Total Memory: 15.88 GiB</p>
        <p class="MemUsed">Used Memory: 2.67 GiB</p>
        <p class="MemFree">Free Memory: 13.21 GiB</p>
        <p class="PerMemFree">Free Memory Percentage: 83.17%</p>
    </div>

    <div class="UptimeContainer">
        <p class="uptime">Uptime: 3 Hours 24 Minutes 14 Seconds</p>
    </div>
</body>

</html>
